type: sections
max_columns: 2
icon: mdi:food-drumstick
path: curing-chamber
title: Curing Chamber
show_icon_and_title: false
# Colour key used throughout: temperature = orange, humidity = blue,
# green = target band, grey = fridge running / cut-off.
sections:
  # ========== Status ==========
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Curing Chamber
        heading_style: title
        icon: mdi:food-drumstick
        badges:
          - type: entity
            entity: sensor.charcuterie_monitor_average_charcuterie_temperature
            icon: mdi:thermometer-lines
            show_state: true
            show_icon: true
          - type: entity
            entity: sensor.charcuterie_monitor_average_charcuterie_humidity
            icon: mdi:water-percent
            show_state: true
            show_icon: true

      # ---------- Headline: what the controller is doing, and whether it's still reporting ----------
      - type: markdown
        text_only: true
        grid_options:
          columns: full
        content: |-
          {% set e = 'sensor.curing_chamber_status' %}
          {% set sw = 'switch.living_room_curing_chamber_sonoff_10018b4516' %}
          {% set pw = 'sensor.living_room_curing_chamber_sonoff_10018b4516_power' %}
          {% macro cap(s) %}{{ s[:1] | upper ~ s[1:] if s else '' }}{% endmacro %}
          {% set status = states(e) %}
          {% set head = status.split(' · ')[0] | lower %}
          {% set upd = state_attr(e, 'updated') %}
          {% set age = ((now() - as_datetime(upd)).total_seconds() / 60) | round(0) | int if upd else 999 %}
          {% set t = state_attr(e, 'temp') %}
          {% set on = is_state(sw, 'on') %}
          {% set title = status %}
          {% set body = cap(state_attr(e, 'decision')) %}
          {% if status in ['unavailable', 'unknown'] or age > 5 %}
            {% set kind = 'error' %}
            {% set title = 'Controller not reporting' %}
            {% set body = 'No update for ' ~ age ~ ' min. Check the automation is on and look at its latest trace.' if upd else 'The status sensor has no data.' %}
          {% elif head in ['fault', 'offline', 'failsafe'] %}{% set kind = 'error' %}
          {% elif head in ['defrost', 'waiting'] %}{% set kind = 'warning' %}
          {% elif t is number and (t < state_attr(e, 'band_low') or t > state_attr(e, 'band_high')) %}{% set kind = 'warning' %}
          {% elif head in ['cooling', 'heating'] %}{% set kind = 'info' %}
          {% else %}{% set kind = 'success' %}{% endif %}
          {% set mins = state_attr(e, 'minutes_in_state') %}
          <ha-alert alert-type="{{ kind }}" title="{{ title }}">{{ body }}</ha-alert>

          Fridge **{{ 'on' if on else 'off' }}**{{ (' for ' ~ (mins | round(0) | int) ~ ' min') if mins is number else '' }}{{ (' · ' ~ (states(pw) | float(0) | round(0) | int) ~ ' W') if on and is_number(states(pw)) else '' }} · {{ 'updated ' ~ (age if age < 999 else '?') ~ ' min ago' if upd else 'never updated' }}

      # ---------- Live readings ----------
      - type: tile
        entity: sensor.charcuterie_monitor_charcuterie_temperature
        name: Temperature
        icon: mdi:thermometer
        color: deep-orange
        vertical: false
        features_position: bottom
        features:
          - type: trend-graph
            hours_to_show: 3
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.charcuterie_monitor_charcuterie_humidity
        name: Humidity
        icon: mdi:water-percent
        color: blue
        vertical: false
        features_position: bottom
        features:
          - type: trend-graph
            hours_to_show: 3
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.living_room_curing_chamber_sonoff_10018b4516_power
        name: Compressor
        icon: mdi:flash
        color: blue-grey
        vertical: false
        features_position: bottom
        features:
          - type: trend-graph
            hours_to_show: 3
        grid_options:
          columns: 6
      - type: tile
        entity: switch.living_room_curing_chamber_sonoff_10018b4516
        name: Fridge
        icon: mdi:fridge-outline
        color: light-blue
        vertical: false
        state_content:
          - state
          - last_changed
        # Tapping opens details instead of toggling, so the fridge can't be switched by accident
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        grid_options:
          columns: 6

  # ========== History ==========
  # Needs a Dropdown helper, input_select.curing_chamber_range, with the options
  # "3 hours", "24 hours" and "30 days". Without it the 3-hour charts show.
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: History
        heading_style: title
      - type: tile
        entity: input_select.curing_chamber_range
        name: Time range
        icon: mdi:calendar-range
        hide_state: true
        vertical: false
        features_position: inline
        features:
          - type: select-options
        grid_options:
          columns: full

      # ---------- 3 hours ----------
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state_not:
              - 24 hours
              - 30 days
        header:
          show: true
          title: Temperature
          show_states: true
          colorize_states: true
        graph_span: 3h
        span:
          end: minute
        update_interval: 1min
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: HH:mm
        yaxis:
          - id: temp
            min: ~11
            max: ~15
            decimals: 1
          - id: fridge
            min: 0
            max: 1
            show: false
        series:
          - entity: switch.living_room_curing_chamber_sonoff_10018b4516
            name: Fridge
            yaxis_id: fridge
            transform: "return x === 'on' ? 1 : 0;"
            type: area
            curve: stepline
            color: "#9e9e9e"
            opacity: 0.12
            stroke_width: 0
            show:
              in_header: false
              legend_value: false
          # The controller's live band (moves when humidity assist shifts the setpoint)
          - entity: sensor.curing_chamber_status
            attribute: band_high
            name: Band high
            unit: °C
            yaxis_id: temp
            curve: stepline
            color: "#4caf50"
            stroke_width: 1
            stroke_dash: 4
            show:
              in_header: false
          - entity: sensor.curing_chamber_status
            attribute: band_low
            name: Band low
            unit: °C
            yaxis_id: temp
            curve: stepline
            color: "#4caf50"
            stroke_width: 1
            stroke_dash: 4
            show:
              in_header: false
          # Where the fridge switches off early to coast down to the band edge
          - entity: sensor.curing_chamber_status
            attribute: cut_off
            name: Cut-off
            unit: °C
            yaxis_id: temp
            curve: stepline
            color: "#9e9e9e"
            stroke_width: 1
            stroke_dash: 2
            show:
              in_header: false
          - entity: sensor.charcuterie_monitor_charcuterie_temperature
            name: Now
            unit: °C
            yaxis_id: temp
            color: "#e0875a"
            stroke_width: 1
            opacity: 0.5
          # Needs the blueprint's "Smoothed temperature (1h mean)" input to be set
          - entity: sensor.curing_chamber_status
            attribute: temp_1h
            name: 1h avg
            unit: °C
            yaxis_id: temp
            color: "#e0875a"
            stroke_width: 2.5
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state_not:
              - 24 hours
              - 30 days
        header:
          show: true
          title: Humidity
          show_states: true
          colorize_states: true
        graph_span: 3h
        span:
          end: minute
        update_interval: 1min
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: HH:mm
          annotations:
            yaxis:
              - "y": 70
                y2: 80
                fillColor: "#4caf50"
                opacity: 0.08
                borderColor: transparent
        yaxis:
          - id: rh
            min: ~60
            max: ~90
            decimals: 0
          - id: fridge
            min: 0
            max: 1
            show: false
        series:
          - entity: switch.living_room_curing_chamber_sonoff_10018b4516
            name: Fridge
            yaxis_id: fridge
            transform: "return x === 'on' ? 1 : 0;"
            type: area
            curve: stepline
            color: "#9e9e9e"
            opacity: 0.12
            stroke_width: 0
            show:
              in_header: false
              legend_value: false
          - entity: sensor.charcuterie_monitor_charcuterie_humidity
            name: Now
            unit: "%"
            yaxis_id: rh
            color: "#5b9be6"
            stroke_width: 1
            opacity: 0.5
          - entity: sensor.charcuterie_monitor_average_charcuterie_humidity
            name: 1h avg
            unit: "%"
            yaxis_id: rh
            color: "#5b9be6"
            stroke_width: 2.5
        grid_options:
          columns: full

      # ---------- 24 hours ----------
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state: 24 hours
        header:
          show: true
          title: Temperature
          show_states: false
        graph_span: 24h
        span:
          end: minute
        update_interval: 5min
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: HH:mm
          annotations:
            yaxis:
              # Your target ± deadband (13 ± 1 °C); adjust if you change them
              - "y": 12
                y2: 14
                fillColor: "#4caf50"
                opacity: 0.08
                borderColor: transparent
        yaxis:
          - id: temp
            min: ~10
            max: ~16
            decimals: 1
          - id: fridge
            min: 0
            max: 1
            show: false
        series:
          - entity: switch.living_room_curing_chamber_sonoff_10018b4516
            name: Fridge
            yaxis_id: fridge
            transform: "return x === 'on' ? 1 : 0;"
            type: area
            curve: stepline
            color: "#9e9e9e"
            opacity: 0.12
            stroke_width: 0
          - entity: sensor.charcuterie_monitor_charcuterie_temperature
            name: Reading
            unit: °C
            yaxis_id: temp
            color: "#e0875a"
            stroke_width: 1
            opacity: 0.5
          - entity: sensor.charcuterie_monitor_average_charcuterie_temperature
            name: Average
            unit: °C
            yaxis_id: temp
            color: "#e0875a"
            stroke_width: 2.5
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state: 24 hours
        header:
          show: true
          title: Humidity
          show_states: false
        graph_span: 24h
        span:
          end: minute
        update_interval: 5min
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: HH:mm
          annotations:
            yaxis:
              - "y": 70
                y2: 80
                fillColor: "#4caf50"
                opacity: 0.08
                borderColor: transparent
        yaxis:
          - id: rh
            min: ~50
            max: 100
            decimals: 0
          - id: fridge
            min: 0
            max: 1
            show: false
        series:
          - entity: switch.living_room_curing_chamber_sonoff_10018b4516
            name: Fridge
            yaxis_id: fridge
            transform: "return x === 'on' ? 1 : 0;"
            type: area
            curve: stepline
            color: "#9e9e9e"
            opacity: 0.12
            stroke_width: 0
          - entity: sensor.charcuterie_monitor_charcuterie_humidity
            name: Reading
            unit: "%"
            yaxis_id: rh
            color: "#5b9be6"
            stroke_width: 1
            opacity: 0.5
          - entity: sensor.charcuterie_monitor_average_charcuterie_humidity
            name: 1h avg
            unit: "%"
            yaxis_id: rh
            color: "#5b9be6"
            stroke_width: 2.5
        grid_options:
          columns: full

      # ---------- 30 days (daily long-term statistics) ----------
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state: 30 days
        header:
          show: true
          title: Temperature · daily
          show_states: false
        graph_span: 30d
        span:
          end: day
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: dd MMM
          annotations:
            yaxis:
              - "y": 12
                y2: 14
                fillColor: "#4caf50"
                opacity: 0.08
                borderColor: transparent
        yaxis:
          - min: ~10
            max: ~16
            decimals: 1
        series:
          - entity: sensor.charcuterie_monitor_charcuterie_temperature
            name: Max
            unit: °C
            color: "#e0875a"
            stroke_width: 1
            opacity: 0.4
            statistics:
              type: max
              period: day
          - entity: sensor.charcuterie_monitor_charcuterie_temperature
            name: Min
            unit: °C
            color: "#e0875a"
            stroke_width: 1
            opacity: 0.4
            statistics:
              type: min
              period: day
          - entity: sensor.charcuterie_monitor_charcuterie_temperature
            name: Mean
            unit: °C
            color: "#e0875a"
            stroke_width: 2.5
            statistics:
              type: mean
              period: day
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        visibility:
          - condition: state
            entity: input_select.curing_chamber_range
            state: 30 days
        header:
          show: true
          title: Humidity · daily
          show_states: false
        graph_span: 30d
        span:
          end: day
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          tooltip:
            x:
              format: dd MMM
          annotations:
            yaxis:
              - "y": 70
                y2: 80
                fillColor: "#4caf50"
                opacity: 0.08
                borderColor: transparent
        yaxis:
          - min: ~50
            max: 100
            decimals: 0
        series:
          - entity: sensor.charcuterie_monitor_charcuterie_humidity
            name: Max
            unit: "%"
            color: "#5b9be6"
            stroke_width: 1
            opacity: 0.4
            statistics:
              type: max
              period: day
          - entity: sensor.charcuterie_monitor_charcuterie_humidity
            name: Min
            unit: "%"
            color: "#5b9be6"
            stroke_width: 1
            opacity: 0.4
            statistics:
              type: min
              period: day
          - entity: sensor.charcuterie_monitor_charcuterie_humidity
            name: Mean
            unit: "%"
            color: "#5b9be6"
            stroke_width: 2.5
            statistics:
              type: mean
              period: day
        grid_options:
          columns: full

  # ========== Compressor ==========
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Compressor
        heading_style: title
      - type: custom:apexcharts-card
        header:
          show: true
          show_states: true
          colorize_states: true
        graph_span: 1.5h
        span:
          end: minute
        update_interval: 1min
        apex_config:
          chart:
            height: 170
          legend:
            show: false
          tooltip:
            x:
              format: HH:mm
        yaxis:
          - id: amps
            min: 0
            decimals: 1
          - id: volts
            opposite: true
            min: 100
            max: 130
            decimals: 0
            show: false
        series:
          - entity: sensor.living_room_curing_chamber_sonoff_10018b4516_current
            name: Current
            unit: A
            yaxis_id: amps
            color: "#78909c"
            type: area
            curve: stepline
            opacity: 0.3
            stroke_width: 1.5
          # Header only: live wattage
          - entity: sensor.living_room_curing_chamber_sonoff_10018b4516_power
            name: Power
            unit: W
            yaxis_id: amps
            color: "#78909c"
            float_precision: 0
            show:
              in_chart: false
          - entity: sensor.living_room_curing_chamber_sonoff_10018b4516_voltage
            name: Supply
            unit: V
            yaxis_id: volts
            color: "#bdbdbd"
            stroke_width: 1
            opacity: 0.6
            group_by:
              func: avg
              duration: 10min
        grid_options:
          columns: full

  # ========== Controller reasoning ==========
  - type: grid
    cards:
      - type: heading
        heading: Why it is doing this
        heading_style: title
      - type: markdown
        grid_options:
          columns: full
        content: |-
          {% set e = 'sensor.curing_chamber_status' %}
          {% macro cap(s) %}{% set s = s | string if s is not none else '' %}{{ s[:1] | upper ~ s[1:] if s else '—' }}{% endmacro %}
          {% set rows = [
            ('Temperature', 'temperature'),
            ('1h trend', 'temp_trend'),
            ('Humidity', 'humidity'),
            ('Power', 'power'),
            ('Supply', 'supply'),
            ('Learned cycle', 'cycle'),
            ('24h averages', 'averages'),
          ] %}
          <table>
          {% for label, key in rows if state_attr(e, key) %}
          <tr><td valign="top"><b>{{ label }}</b></td><td>{{ cap(state_attr(e, key)) }}</td></tr>
          {% endfor %}
          </table>

  # ========== Learned on/off schedule (used by the failsafe) ==========
  - type: grid
    cards:
      - type: heading
        heading: Learned cycle
        heading_style: title
      # Duty per 3-hour slot. Faded bars are slots with fewer than 3 clean cycles.
      - type: custom:apexcharts-card
        graph_span: 24h
        span:
          start: day
        update_interval: 5min
        now:
          show: true
          label: Now
        header:
          show: false
        apex_config:
          chart:
            height: 200
          legend:
            show: false
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 3
          tooltip:
            x:
              format: HH:mm
          xaxis:
            labels:
              format: HH:mm
        yaxis:
          - min: 0
            max: ~50
            decimals: 0
        series:
          - entity: sensor.curing_chamber_status
            name: Duty
            type: column
            unit: "%"
            color: "#78909c"
            data_generator: |
              const p = entity.attributes.learned_profile;
              if (!p) return [];
              const d = new Date(start); d.setHours(0, 0, 0, 0);
              return p.on.map((on, i) => {
                const off = p.off[i];
                const ready = p.on_samples[i] >= 3 && p.off_samples[i] >= 3;
                const duty = ready && on + off > 0 ? Math.round(100 * on / (on + off)) : null;
                return [d.getTime() + (i * 3 + 1.5) * 3600000, duty];
              });
          - entity: sensor.curing_chamber_status
            name: Learning
            type: column
            unit: "%"
            color: "#78909c"
            opacity: 0.35
            data_generator: |
              const p = entity.attributes.learned_profile;
              if (!p) return [];
              const d = new Date(start); d.setHours(0, 0, 0, 0);
              return p.on.map((on, i) => {
                const off = p.off[i];
                const ready = p.on_samples[i] >= 3 && p.off_samples[i] >= 3;
                const seen = p.on_samples[i] > 0 && p.off_samples[i] > 0;
                const duty = !ready && seen && on + off > 0 ? Math.round(100 * on / (on + off)) : null;
                return [d.getTime() + (i * 3 + 1.5) * 3600000, duty];
              });
        grid_options:
          columns: full
      - type: markdown
        grid_options:
          columns: full
        content: |-
          {% set p = state_attr('sensor.curing_chamber_status', 'learned_profile') %}
          {% if p %}
          | Slot | On | Off | Duty | Cycles |
          |:--|--:|--:|--:|--:|
          {% for i in range(8) -%}
          {%- set n_on, n_off = p.on_samples[i], p.off_samples[i] -%}
          {%- set ready = n_on >= 3 and n_off >= 3 -%}
          {%- set cur = i == now().hour // 3 -%}
          | {{ '**' if cur else '' }}{{ '%02d:00' | format(i * 3) }}{{ ' · now**' if cur else '' }} | {{ (p.on[i] | round(0) | int ~ ' m') if n_on else '—' }} | {{ (p.off[i] | round(0) | int ~ ' m') if n_off else '—' }} | {{ ((100 * p.on[i] / (p.on[i] + p.off[i])) | round(0) | int ~ ' %') if ready else 'learning' }} | {{ n_on }}/{{ n_off }} |
          {% endfor %}
          {% else %}
          Nothing learned yet. Set a memory helper in the blueprint.
          {% endif %}
cards: []
